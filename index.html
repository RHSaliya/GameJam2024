<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
	<meta name="theme-color" content="#11162d" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<!-- Favicons -->
	<link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="512x512" href="favicons/android-chrome-512x512.png">
	<link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
	<link rel="manifest" href="/favicons/site.webmanifest">
	<link rel="shortcut icon" href="favicons/favicon.ico">
	<!-- End Favicons -->
	<title>Quarrel Through The Cosmos</title>
	<style>
		html, body, #app {
			background-color: #171424;
			margin: 0;
			padding: 0;
			overflow: hidden;
			width: 100%;
			height: 100%;
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
		}
		canvas { display: block; image-rendering: auto; transform: translateZ(0); }
		#rotate-device { display: none; position: fixed; inset: 0; z-index: 9999; place-items: center; padding: 32px; background: #11162d; color: white; text-align: center; font: 26px Arial, sans-serif; }
		@media (orientation: portrait) and (max-width: 700px) { #rotate-device { display: grid; } }
	</style>

</head>

<body>
	<div id="app"></div>
	<div id="rotate-device">Rotate your device to landscape to launch into the cosmos.</div>
	<script type="module" src="src/main.js"></script>
	<script>
		const nativeWebView = navigator.userAgent.includes('; wv') || window.Capacitor?.isNativePlatform?.();
		if ('serviceWorker' in navigator && nativeWebView) {
			window.addEventListener('load', async () => {
				const registrations = await navigator.serviceWorker.getRegistrations();
				await Promise.all(registrations.map(registration => registration.unregister()));
				if ('caches' in window) {
					const keys = await caches.keys();
					await Promise.all(keys.map(key => caches.delete(key)));
				}
			});
		} else if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
			window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));
		}
	</script>
</body>

</html>
